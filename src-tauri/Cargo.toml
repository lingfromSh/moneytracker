[package]
name = "moneytracker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Plain-text double-entry bookkeeping, capture first"

[lib]
name = "moneytracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "0.0.13"
specta = { workspace = true }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
blake3.workspace = true
rust_decimal.workspace = true
notify = "6"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ledger-core = { path = "../crates/ledger-core" }
ledger-query = { path = "../crates/ledger-query" }
ledger-engine = { path = "../crates/ledger-engine" }
ledger-sync = { path = "../crates/ledger-sync" }

# Tray, menu-bar positioning and the global hotkey only exist on the desktop
# shells; Android/iOS would fail to link them.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

[dev-dependencies]
tempfile = "3"
