name: Android APK

# Tag 一推就打出签名 APK 并挂到 Release；也可以手动跑一次只拿 artifact。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "ABI"
        type: choice
        default: arm64
        options: [arm64, armv7, x86_64]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NDK_VERSION: 27.2.12479018
  ABI: ${{ inputs.target || 'arm64' }}

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ inputs.target || 'arm64' }}-${{ hashFiles('Cargo.lock') }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build, sign and align
        env:
          KEYSTORE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: bash scripts/android-apk.sh "$ABI"

      - name: Checksum
        run: |
          APK="build/android/moneytracker-$(node -p "require('./src-tauri/tauri.conf.json').version")-${ABI}.apk"
          sha256sum "$APK" | tee "$APK.sha256"
          {
            echo "### ${{ github.ref_name }} · ${ABI}"
            echo '```'
            cat "$APK.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: moneytracker-apk-${{ env.ABI }}
          path: |
            build/android/*.apk
            build/android/*.sha256
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/android/*.apk
            build/android/*.sha256
          generate_release_notes: false
          fail_on_unmatched_files: true
