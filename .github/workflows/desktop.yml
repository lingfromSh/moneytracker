name: Desktop builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: desktop-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  macos:
    name: macOS ${{ matrix.label }}
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: arm64
          - target: x86_64-apple-darwin
            label: x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.label }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dmg
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Checksum
        run: |
          cd "target/${{ matrix.target }}/release/bundle/dmg"
          shasum -a 256 ./*.dmg | sed 's|\./||' > "SHA256SUMS-macos-${{ matrix.label }}.txt"
          cat "SHA256SUMS-macos-${{ matrix.label }}.txt" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: moneytracker-dmg-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/dmg/SHA256SUMS-*.txt
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/dmg/SHA256SUMS-*.txt
          generate_release_notes: false
          fail_on_unmatched_files: true

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            file

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deb + AppImage
        run: pnpm tauri build --bundles deb,appimage

      - name: Checksum
        run: |
          cd target/release/bundle
          shasum -a 256 deb/*.deb appimage/*.AppImage | sed 's|^\(\S*\)  \(deb\|appimage\)/|\1  |' > "SHA256SUMS-linux-x64.txt"
          cat "SHA256SUMS-linux-x64.txt" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: moneytracker-linux-x64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/SHA256SUMS-linux-x64.txt
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/SHA256SUMS-linux-x64.txt
          generate_release_notes: false
          fail_on_unmatched_files: true
